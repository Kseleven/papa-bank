<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小小存钱罐 🐷</title>
<style>
  :root{--bg:#fff7ed;--card:#fff;--accent:#f97316;--green:#16a34a;--red:#dc2626;--ink:#1f2937;--muted:#6b7280;--line:#fde9d2;}
  *{box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);padding:12px 16px;overflow:auto;}
  .wrap{max-width:1080px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
  h1{text-align:center;font-size:22px;margin:2px 0 0;color:var(--accent);}
  .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px;}
  .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(249,115,22,.10);}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .tab{padding:6px 13px;border-radius:999px;background:#fff;border:2px solid var(--line);cursor:pointer;font-size:14px;}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tab.add{border-style:dashed;color:var(--accent);}
  /* 左右布局 */
  .cols{display:flex;gap:16px;align-items:flex-start;flex:1;min-height:0;}
  .col-left{flex:0 0 330px;display:flex;flex-direction:column;gap:12px;}
  .col-right{flex:1;min-width:0;}
  @media (max-width:760px){
    .cols{flex-direction:column;}
    .col-left{flex:none;width:100%;}
    .col-right{width:100%;}
  }
  .balance{text-align:center;}
  .balance .name{font-size:14px;color:var(--muted);}
  .balance .amt{font-size:36px;font-weight:800;color:var(--green);margin:4px 0;}
  .balance .sub2{font-size:12px;color:var(--muted);}
  .row{display:flex;gap:8px;margin-top:8px;}
  input{padding:9px;border:2px solid var(--line);border-radius:11px;font-size:15px;width:100%;}
  button{cursor:pointer;border:none;border-radius:11px;padding:10px 12px;font-size:15px;font-weight:600;color:#fff;}
  .b-dep{background:var(--green);} .b-wd{background:var(--red);}
  .b-ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);}
  .danger{color:var(--red);background:#fff;border:2px solid var(--red);}
  .grow{flex:1;}
  label{font-size:12px;color:var(--muted);display:block;margin:8px 0 3px;}
  .small{font-size:12px;color:var(--muted);}
  /* 日历 */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .calhead button{background:var(--accent);padding:5px 12px;}
  .calhead .m{font-size:16px;font-weight:700;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .dow{text-align:center;font-size:12px;color:var(--muted);padding:2px 0;}
  .cell{aspect-ratio:1;border-radius:10px;background:#fdf3e7;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;}
  .cell.empty{background:transparent;cursor:default;}
  .cell .d{font-size:12px;color:var(--muted);}
  .cell .v{font-size:12px;font-weight:700;color:var(--green);margin-top:2px;}
  .cell.today{border-color:var(--accent);}
  .legend{font-size:11px;color:var(--muted);margin-top:6px;text-align:center;}
  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(31,41,55,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px;}
  .modal-body{overflow:auto;padding:6px 18px 18px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--muted);position:sticky;top:0;background:var(--card);}
  .note{color:var(--muted);max-width:180px;}
  .note .txt{display:inline-block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;cursor:pointer;}
  .note.open .txt{white-space:normal;word-break:break-all;max-width:none;}
  .pos{color:var(--green);} .neg{color:var(--red);}
  .editbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;padding:2px 4px;font-weight:400;}
  /* 分页栏 */
  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;font-size:13px;color:var(--muted);}
  .pager .ctrl{display:flex;align-items:center;gap:6px;}
  .pager button{background:var(--accent);padding:5px 11px;font-size:13px;}
  .pager button:disabled{background:#e5e7eb;color:#9ca3af;cursor:default;}
  .pager select{padding:5px 8px;border:2px solid var(--line);border-radius:9px;font-size:13px;width:auto;}
  .hide{display:none;}
  /* 成长小结：暖色手账与奖励贴纸 */
  .summary-switch{display:flex;gap:8px;margin:14px 0 8px;}
  .summary-switch button{flex:1;background:#fff;color:var(--accent);border:2px solid var(--line);}
  .summary-switch button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);}
  .summary-nav{display:flex;align-items:center;gap:8px;margin:10px 0 6px;}
  .summary-nav button{flex:none;padding:7px 12px;background:#fff;color:var(--accent);border:2px solid var(--line);}
  .summary-nav .summary-date-display{flex:1;min-width:0;overflow:hidden;padding:8px 6px;background:#fff7ed;color:var(--ink);border-color:var(--line);font-size:14px;text-overflow:ellipsis;white-space:nowrap;}
  .summary-nav .summary-date-display:hover{background:#fff;border-color:var(--accent);}
  .summary-nav input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .summary-nav button:disabled{color:#9ca3af;background:#f3f4f6;cursor:default;}
  .summary-nav .summary-today{font-size:12px;padding:7px 9px;}
  .summary-modal{max-width:980px;max-height:90vh;}
  .summary-modal .modal-body{padding:8px 22px 18px;}
  .summary-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:22px;align-items:start;}
  .summary-main,.summary-aside{min-width:0;}
  .summary-aside{position:sticky;top:0;}
  .summary-hero{position:relative;margin:12px 0;padding:18px;border:2px solid #fbd38d;border-radius:16px;background:linear-gradient(125deg,#fff8dc,#fff0d9);}
  .summary-hero .kicker{font-size:12px;color:#9a5310;letter-spacing:2px;}
  .summary-hero h4{margin:10px 0;font-size:22px;color:#92400e;line-height:1.4;overflow-wrap:anywhere;}
  .summary-hero p{margin:0;color:#9a5310;font-size:14px;line-height:1.7;}
  .summary-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0;}
  .summary-stat{padding:12px 6px;border-radius:12px;background:#f0fdf4;text-align:center;}
  .summary-stat strong{display:block;color:#15803d;font-size:20px;overflow-wrap:anywhere;}
  .summary-stat.outcome{background:#fff1f2;}
  .summary-stat.outcome strong{color:#dc2626;}
  .summary-stat.net{background:#fff7ed;}
  .summary-stat.net strong{color:#c2410c;}
  .summary-stat span{display:block;margin-top:5px;font-size:12px;color:var(--muted);}
  .summary-section{margin-top:18px;}
  .summary-section h5{margin:0;padding-bottom:4px;font-size:14px;color:var(--ink);}
  .summary-impact{margin-top:18px;padding:14px;border:2px solid #bfdbfe;border-radius:14px;background:#eff6ff;}
  .summary-impact h5{margin:0;color:#1e40af;font-size:14px;}
  .summary-impact p{margin:7px 0 12px;color:#475569;font-size:12px;line-height:1.7;}
  .summary-impact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
  .summary-impact-item{padding:9px 5px;border-radius:10px;background:#fff;text-align:center;}
  .summary-impact-item strong{display:block;color:#1d4ed8;font-size:15px;overflow-wrap:anywhere;}
  .summary-impact-item span{display:block;margin-top:4px;color:#64748b;font-size:11px;}
  .summary-impact-item em{display:block;margin-top:3px;color:#16a34a;font-size:11px;font-style:normal;}
  .summary-tip{margin-top:14px;padding:14px;border-radius:14px;background:#f0fdf4;border:2px solid #bbf7d0;color:#166534;}
  .summary-tip h5{margin:0 0 6px;font-size:14px;}
  .summary-tip p{margin:0;font-size:12px;line-height:1.7;}
  .summary-activity{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line);}
  .summary-badge{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff2d6;font-size:20px;}
  .summary-activity .grow{min-width:0;}
  .summary-activity strong{display:block;overflow-wrap:anywhere;font-size:15px;line-height:1.6;}
  .summary-activity .small{margin-top:3px;line-height:1.6;}
  .summary-amount{flex:none;color:var(--green);font-weight:700;font-size:16px;}
  .summary-amount.outcome{color:var(--red);}
  .summary-foot{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.7;}
  .summary-empty{text-align:center;padding:24px 12px;line-height:1.8;color:var(--muted);}
  .summary-error{padding:20px 0;color:var(--red);}
  @media(max-width:760px){.summary-layout{grid-template-columns:1fr;gap:4px;}.summary-aside{position:static;}.summary-impact{margin-top:14px;}}
  @media(max-width:420px){.summary-activity{flex-wrap:wrap;}.summary-amount{margin-left:52px;}.summary-stat strong{font-size:17px;}.summary-nav{flex-wrap:wrap;}.summary-nav .summary-today{margin-left:auto;}.summary-modal .modal-body{padding-left:16px;padding-right:16px;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐷 小小存钱罐</h1>
  <div class="sub">存钱有利息,养成储蓄好习惯</div>

  <div class="tabs" id="tabs"></div>

  <div class="cols" id="cols">
    <!-- 左侧:存取 + 设置 + 明细入口 -->
    <div class="col-left">
      <div id="opCard" class="card">
        <div class="balance">
          <div class="name" id="accName"></div>
          <div class="amt" id="balance">¥0.00</div>
          <div class="sub2" id="meta"></div>
        </div>
        <label>金额</label>
        <input type="number" id="opAmount" placeholder="输入金额" min="0" step="0.01">
        <label>备注(可选)</label>
        <input type="text" id="opNote" placeholder="例如:压岁钱 / 买玩具">
        <div class="row">
          <button class="b-dep grow" onclick="op('deposit')">💰 存入</button>
          <button class="b-wd grow" onclick="op('withdraw')">🏧 取出</button>
        </div>
        <div class="row">
          <button class="b-ghost grow" onclick="openHist()">📜 查看明细</button>
          <button class="b-ghost grow" onclick="toggle('settings')">⚙️ 利率</button>
        </div>
        <div class="row">
          <button id="summaryOpen" class="b-ghost grow" onclick="openSummary()">🌟 总结 · 看看我的进步</button>
        </div>
        <div id="settings" class="hide" style="margin-top:10px;">
          <label>月利率 (%) — 每30天的利率</label>
          <input type="number" id="rate" step="0.1" min="0">
          <div class="small" style="margin-top:6px;">设10%表示每30天余额×1.1,按等价日利率每天复利滚动。</div>
          <div class="row">
            <button class="b-ghost grow" onclick="saveRate()">保存利率</button>
            <button class="danger grow" onclick="delAcc()">删除账户</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧:日历 -->
    <div class="col-right">
      <div id="calCard" class="card">
        <div class="calhead">
          <button onclick="moveMonth(-1)">‹</button>
          <div class="m" id="calMonth"></div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button style="padding:5px 10px;font-size:13px;background:#fff;color:var(--accent);border:2px solid var(--accent);" onclick="goToday()">回到今天</button>
            <button onclick="moveMonth(1)">›</button>
          </div>
        </div>
        <div class="grid" id="dows"></div>
        <div class="grid" id="calGrid"></div>
        <div class="legend">点开每一天,看看钱长大了多少 🌱 · 绿色越深表示当天总额越高</div>
      </div>
    </div>
  </div>
</div>

<!-- 本周 / 本月成长小结 -->
<div class="overlay" id="summaryOverlay" onclick="if(event.target===this)closeSummary()">
  <div class="modal summary-modal" role="dialog" aria-modal="true" aria-labelledby="summaryTitle">
    <div class="modal-head">
      <h3 id="summaryTitle">🌟 成长小结</h3>
      <button id="summaryClose" class="modal-close" aria-label="关闭总结" onclick="closeSummary()">×</button>
    </div>
    <div class="modal-body">
      <div class="summary-switch" role="group" aria-label="总结时间范围">
        <button id="summaryWeek" aria-pressed="false" onclick="setSummaryPeriod('week')">周总结</button>
        <button id="summaryMonth" aria-pressed="true" onclick="setSummaryPeriod('month')">月总结</button>
      </div>
      <div class="summary-nav" aria-label="选择总结时间">
        <button type="button" aria-label="上一个时间段" onclick="shiftSummary(-1)">‹</button>
        <button id="summaryPickerDisplay" type="button" class="summary-date-display" onclick="openSummaryPicker()" aria-label="选择总结月份">2026年10月</button>
        <input id="summaryPicker" type="month" onchange="selectSummaryDate(this.value)" aria-label="选择总结月份">
        <button id="summaryNext" type="button" aria-label="下一个时间段" onclick="shiftSummary(1)">›</button>
        <button type="button" class="summary-today" onclick="summaryToday()">回到现在</button>
      </div>
      <div id="summaryRange" class="small"></div>
      <div id="summaryContent" aria-live="polite"></div>
      <div class="summary-foot">存入和取出都会按备注分别汇总，每笔计 1 次；利息不计入。未填写备注的记录单独列出。记录奖励或支出时使用相同活动名称，就能看清自己的收获和使用情况啦！</div>
    </div>
  </div>
</div>

<!-- 单日明细弹窗 -->
<div class="overlay" id="dayOverlay" onclick="if(event.target===this)closeDay()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="dayTitle">📅 当日明细</h3>
      <button class="modal-close" onclick="closeDay()">×</button>
    </div>
    <div class="modal-body">
      <div id="daySummary" class="small" style="margin:6px 0 10px;"></div>
      <div style="background:#fdf3e7;border-radius:12px;padding:10px 12px;margin-bottom:12px;">
        <div class="small" style="margin-bottom:6px;">✏️ 给这一天补录一笔</div>
        <div class="row" style="margin-top:0;">
          <input type="number" id="dayOpAmount" class="grow" placeholder="金额" min="0" step="0.01">
          <input type="text" id="dayOpNote" class="grow" placeholder="备注(可选)">
        </div>
        <div class="row">
          <button class="b-dep grow" onclick="opOnDay('deposit')">💰 存入</button>
          <button class="b-wd grow" onclick="opOnDay('withdraw')">🏧 取出</button>
        </div>
      </div>
      <table><thead><tr><th>时间</th><th>类型</th><th>金额</th><th>余额</th><th>备注</th><th></th></tr></thead>
      <tbody id="dayRows"></tbody></table>
    </div>
  </div>
</div>

<!-- 明细弹窗 -->
<div class="overlay" id="histOverlay" onclick="if(event.target===this)closeHist()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="histTitle">📜 存取明细</h3>
      <button class="modal-close" onclick="closeHist()">×</button>
    </div>
    <div class="modal-body">
      <table><thead><tr><th>时间</th><th>类型</th><th>金额</th><th>余额</th><th>备注</th><th></th></tr></thead>
      <tbody id="histRows"></tbody></table>
    </div>
    <div class="pager" id="pager">
      <div class="ctrl">
        每页
        <select id="pageSize" onchange="setPageSize()">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
          <option value="50">50</option>
        </select>
        条
      </div>
      <div class="ctrl">
        <button id="prevPage" onclick="gotoPage(histPage-1)">‹ 上一页</button>
        <span id="pageInfo"></span>
        <button id="nextPage" onclick="gotoPage(histPage+1)">下一页 ›</button>
      </div>
    </div>
  </div>
</div>

<!-- 版本号用于避免浏览器继续使用旧的总结逻辑缓存。 -->
<script src="/summary.js?v=20261009-3"></script>
<script>
const API='/api';
let accounts=[], cur=null;
let calYear, calMonth;
let histRecs=[], histPage=1, histPageSize=20;
let curDay=null;
let summaryRecs=[], summaryMode='month', summaryState='idle', summaryRequest=0;
let summaryFocus=null;
let summaryAnchor=new Date();
let summaryRate=0;

async function j(url,opt){const r=await fetch(url,opt);if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||'错误');}return r.status===204?null:r.json();}
function fmt(n){return '¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pad(x){return String(x).padStart(2,'0');}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadAccounts(){
  accounts=await j(API+'/accounts');
  if(accounts.length && (cur===null || !accounts.find(a=>a.id===cur))) cur=accounts[0].id;
  render();
}
async function newAccount(){
  const name=prompt('孩子的名字?'); if(!name)return;
  const rate=parseFloat(prompt('月利率(%),例如 10','10'))||0;
  const a=await j(API+'/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,monthly_rate:rate})});
  cur=a.id; await loadAccounts();
}
async function op(type){
  if(cur===null)return;
  const amt=parseFloat(document.getElementById('opAmount').value);
  if(!(amt>0)){alert('请输入大于0的金额');return;}
  const note=document.getElementById('opNote').value.trim();
  try{
    await j(API+`/accounts/${cur}/tx`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,amount:amt,note})});
    document.getElementById('opAmount').value='';
    document.getElementById('opNote').value='';
    await refresh();
  }catch(e){alert(e.message);}
}
async function saveRate(){
  const rate=parseFloat(document.getElementById('rate').value)||0;
  await j(API+`/accounts/${cur}/rate`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({monthly_rate:rate})});
  await refresh();
}
async function delAcc(){
  if(cur===null)return;
  const a=accounts.find(x=>x.id===cur);
  if(!confirm('确定删除「'+a.name+'」及全部记录?'))return;
  await j(API+`/accounts/${cur}`,{method:'DELETE'});
  cur=null; await loadAccounts();
}
async function editNote(id,old){
  const nv=prompt('修改备注:',old||'');
  if(nv===null)return;
  await j(API+`/tx/${id}/note`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:nv.trim()})});
  await loadHistory(true);
}
function toggle(id){document.getElementById(id).classList.toggle('hide');}
function selectAcc(id){cur=id;refresh();}
async function refresh(){ await loadAccounts(); }

// 弹窗
function openHist(){
  if(cur===null)return;
  const a=accounts.find(x=>x.id===cur);
  document.getElementById('histTitle').textContent=`📜 ${a.name} 的存取明细`;
  document.getElementById('histOverlay').classList.add('show');
  loadHistory();
}
function closeHist(){document.getElementById('histOverlay').classList.remove('show');}
function closeDay(){document.getElementById('dayOverlay').classList.remove('show');}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeHist();closeDay();closeSummary();}
  if(e.key==='Tab' && document.getElementById('summaryOverlay').classList.contains('show')){
    const controls=[...document.querySelectorAll('#summaryOverlay button:not(:disabled), #summaryOverlay input')];
    const first=controls[0], last=controls[controls.length-1];
    if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
  }
});

async function openSummary(){
  if(cur===null)return;
  const a=accounts.find(x=>x.id===cur);
  if(!a)return;
  const request=++summaryRequest;
  const accountID=cur;
  summaryRate=a.monthly_rate;
  summaryFocus=document.activeElement;
  document.getElementById('summaryTitle').textContent=`🌟 ${a.name} 的成长小结`;
  document.getElementById('summaryOverlay').classList.add('show');
  document.getElementById('summaryClose').focus();
  summaryState='loading'; summaryRecs=[];
  renderSummary();
  try{
    const records=await j(API+`/accounts/${accountID}/tx`);
    if(request!==summaryRequest)return;
    summaryRecs=records; summaryState='ready'; renderSummary();
  }catch(e){
    if(request!==summaryRequest)return;
    summaryState='error';
    document.getElementById('summaryContent').innerHTML=`<div class="summary-error">总结暂时加载失败：${esc(e.message)}</div><button class="b-ghost" onclick="openSummary()">重新加载</button>`;
  }
}
function closeSummary(){
  const overlay=document.getElementById('summaryOverlay');
  if(!overlay.classList.contains('show'))return;
  overlay.classList.remove('show'); summaryRequest++;
  const opener=document.getElementById('summaryOpen');
  if(summaryFocus && !overlay.contains(summaryFocus))summaryFocus.focus();
  else opener.focus();
}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function monthKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;}
function selectedSummaryDate(){return summaryMode==='month' ? monthKey(summaryAnchor) : dateKey(summaryAnchor);}
function setSummaryPeriod(period){summaryMode=period;renderSummary();}
function openSummaryPicker(){
  const picker=document.getElementById('summaryPicker');
  if(typeof picker.showPicker==='function')picker.showPicker();
  else picker.click();
}
function shiftSummary(direction){
  const next=shiftSummaryDate(summaryMode,summaryAnchor,direction);
  const now=new Date();
  if(next.getTime()>now.getTime())return;
  summaryAnchor=next;
  renderSummary();
}
function selectSummaryDate(value){
  const pattern=summaryMode==='month'?/^\d{4}-\d{2}$/:/^\d{4}-\d{2}-\d{2}$/;
  if(!pattern.test(value)){renderSummary();return;}
  const parts=value.split('-').map(Number);
  const selected=new Date(parts[0],parts[1]-1,parts[2]||1);
  const key=summaryMode==='month'?monthKey(selected):dateKey(selected);
  if(key===value && selected<=new Date())summaryAnchor=selected;
  renderSummary();
}
function summaryToday(){summaryAnchor=new Date();renderSummary();}
function renderSummary(){
  document.getElementById('summaryWeek').setAttribute('aria-pressed',String(summaryMode==='week'));
  document.getElementById('summaryMonth').setAttribute('aria-pressed',String(summaryMode==='month'));
  const picker=document.getElementById('summaryPicker');
  const pickerDisplay=document.getElementById('summaryPickerDisplay');
  const now=new Date();
  picker.type=summaryMode==='month'?'month':'date';
  picker.value=selectedSummaryDate();
  picker.max=summaryMode==='month'?monthKey(now):dateKey(now);
  picker.setAttribute('aria-label',summaryMode==='month'?'选择总结月份':'选择总结周内日期');
  const displayDate=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  pickerDisplay.textContent=summaryMode==='month'
    ? `${summaryAnchor.getFullYear()}年${summaryAnchor.getMonth()+1}月`
    : displayDate(summaryAnchor);
  pickerDisplay.setAttribute('aria-label',summaryMode==='month'?'选择总结月份':'选择总结周内日期');
  const result=buildSummary(summaryRecs,summaryMode,now,summaryAnchor);
  const dateText=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const isCurrent=result.start.getTime()===summaryPeriod(summaryMode,now).start.getTime();
  document.getElementById('summaryNext').disabled=isCurrent;
  document.getElementById('summaryRange').textContent=`${dateText(result.start)} — ${dateText(result.end)}${isCurrent?' · 截至现在':''}${summaryMode==='week'?' · 周一开始':''}`;
  const content=document.getElementById('summaryContent');
  if(summaryState==='loading'){content.innerHTML='<div class="summary-empty">正在收集你的成长足迹…</div>';return;}
  if(summaryState!=='ready')return;
  const label=isCurrent?(summaryMode==='week'?'本周':'本月'):(summaryMode==='month'?`${summaryAnchor.getFullYear()}年${summaryAnchor.getMonth()+1}月`:'这一周');
  if(!result.depositCount && !result.withdrawalCount){
    content.innerHTML=`<div class="summary-hero"><div class="kicker">🌱 每一点进步都值得记录</div><h4>新的成长故事，等你开启！</h4><p>${label}还没有存入或取出记录。下一次获得奖励或使用零花钱时，记下这一步就好啦。</p></div>`;
    return;
  }
  const named=result.depositGroups.filter(group=>!group.unnamed);
  const renderGroups=(groups,type)=>{
    if(!groups.length)return '<div class="small" style="padding:8px 0 2px;">这段时间没有记录。</div>';
    const isDeposit=type==='deposit';
    return groups.map(group=>`<div class="summary-activity"><div class="summary-badge" aria-hidden="true">${isDeposit?(group.unnamed?'💰':'⭐'):'🛍️'}</div><div class="grow"><strong>${esc(group.name)} × ${group.count} 次</strong><div class="small">${group.unnamed?(isDeposit?'补上备注，让这份收获有自己的名字。':'补上备注，记住这笔支出用在了哪里。'):(isDeposit?'每一次积累，都值得被看见。':'知道钱花在哪里，也是在学习管理小金库。')}</div></div><div class="summary-amount${isDeposit?'':' outcome'}">${isDeposit?'获得':'支出'} ${fmt(group.amount)}</div></div>`).join('');
  };
  const namedCount=named.reduce((sum,group)=>sum+group.count,0);
  const encouragement=named.length?`你留下了 ${namedCount} 次有名字的成长足迹，也记录了 ${result.withdrawalCount} 次支出。每一次认真去做、合理使用，都是成长！`:'你正在一点点积累和管理自己的小金库。给每笔记录加上活动备注，就能记住每一份进步！';
  const impactPrincipal=opportunityBase(result.withdrawalOpportunityRecords,summaryRate,result.end);
  const impact=opportunityGrowth(impactPrincipal,summaryRate,result.end);
  const impactHtml=result.withdrawalAmount>0?`<div class="summary-impact"><h5>📈 支出影响：如果这笔钱留下来</h5><p>按发生时间折算，如果这 ${fmt(result.withdrawalAmount)} 支出一直留在账户里，到 ${result.end.getFullYear()}年${result.end.getMonth()+1}月${result.end.getDate()}日约为 ${fmt(impactPrincipal)}；之后按当前月利率 ${summaryRate}% 继续存下去，可能会变成：</p><div class="summary-impact-grid">${impact.map(item=>`<div class="summary-impact-item"><strong>${fmt(item.total)}</strong><span>${item.label}</span><em>再增加 ${fmt(item.gain)}</em></div>`).join('')}</div></div>`:'<div class="summary-impact"><h5>📈 支出影响</h5><p>记录一笔支出后，这里会帮你看看如果把钱留下来，未来可能多出多少收益。</p></div>';
  content.innerHTML=`<div class="summary-layout"><div class="summary-main">
      <div class="summary-hero"><div class="kicker">🏅 我的成长小手账</div><h4>${label}的积累，值得为自己鼓掌！</h4><p>${encouragement}</p></div>
      <div class="summary-stats">
        <div class="summary-stat"><strong>${fmt(result.depositAmount)}</strong><span>获得 · ${result.depositCount} 次</span></div>
        <div class="summary-stat outcome"><strong>${fmt(result.withdrawalAmount)}</strong><span>支出 · ${result.withdrawalCount} 次</span></div>
        <div class="summary-stat net"><strong>${result.netAmount >= 0 ? '+' + fmt(result.netAmount) : '-' + fmt(Math.abs(result.netAmount))}</strong><span>净变化 · ${result.days} 天有记录</span></div>
      </div>
      <div class="summary-section"><h5>💰 获得奖励</h5>${renderGroups(result.depositGroups,'deposit')}</div>
      <div class="summary-section"><h5>🛍️ 支出记录</h5>${renderGroups(result.withdrawalGroups,'withdraw')}</div>
    </div><aside class="summary-aside">${impactHtml}<div class="summary-tip"><h5>🌱 小小提醒</h5><p>先想一想，再决定要不要花钱。每一次把钱留下来，都是给未来的自己增加一份选择。</p></div></aside></div>`;
}

async function openDay(ds,bal){
  if(cur===null)return;
  curDay=ds;
  const a=accounts.find(x=>x.id===cur);
  document.getElementById('dayTitle').textContent=`📅 ${a.name} · ${ds}`;
  document.getElementById('dayOverlay').classList.add('show');
  document.getElementById('dayOpAmount').value='';
  document.getElementById('dayOpNote').value='';
  const tb=document.getElementById('dayRows');
  const sum=document.getElementById('daySummary');
  tb.innerHTML='<tr><td colspan="6" class="small">加载中…</td></tr>';
  sum.textContent='';
  let recs=[];
  try{ recs=await j(API+`/accounts/${cur}/tx`); }catch(e){
    tb.innerHTML=`<tr><td colspan="6" class="small">加载失败: ${esc(e.message)}</td></tr>`;
    return;
  }
  const dayRecs=recs.filter(e=>{
    const d=new Date(e.ts);
    const s=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    return s===ds;
  });
  let inSum=0,outSum=0;
  dayRecs.forEach(e=>{ if(e.type==='deposit')inSum+=e.amount; else outSum+=e.amount; });
  const balTxt=(bal!==undefined)?` · 当日结余 ${fmt(bal)}`:'';
  sum.textContent=`共 ${dayRecs.length} 笔 · 存入 ${fmt(inSum)} · 取出 ${fmt(outSum)}${balTxt}`;
  tb.innerHTML='';
  if(!dayRecs.length){
    tb.innerHTML='<tr><td colspan="6" class="small">这一天还没有存取记录哦~</td></tr>';
    return;
  }
  dayRecs.forEach(e=>{
    const d=new Date(e.ts);
    const tr=document.createElement('tr');
    const cls=e.type==='deposit'?'pos':'neg', s=e.type==='deposit'?'+':'-', label=e.type==='deposit'?'存入':'取出';
    const noteHtml=e.note?`<span class="txt" title="点击展开/收起">${esc(e.note)}</span>`:'<span class="small">—</span>';
    tr.innerHTML=`<td>${pad(d.getHours())}:${pad(d.getMinutes())}</td>
      <td>${label}</td><td class="${cls}">${s}${fmt(e.amount)}</td><td>${fmt(e.balance)}</td>
      <td class="note">${noteHtml}</td>
      <td><button class="editbtn" title="修改备注">✏️</button></td>`;
    const noteCell=tr.querySelector('.note');
    const txt=noteCell.querySelector('.txt');
    if(txt)txt.onclick=()=>noteCell.classList.toggle('open');
    tr.querySelector('.editbtn').onclick=async()=>{ await editNoteDay(e.id,e.note,ds,bal); };
    tb.appendChild(tr);
  });
}
async function opOnDay(type){
  if(cur===null||!curDay)return;
  const amt=parseFloat(document.getElementById('dayOpAmount').value);
  if(!(amt>0)){alert('请输入大于0的金额');return;}
  const note=document.getElementById('dayOpNote').value.trim();
  try{
    await j(API+`/accounts/${cur}/tx`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type,amount:amt,note,date:curDay})});
    document.getElementById('dayOpAmount').value='';
    document.getElementById('dayOpNote').value='';
    await loadAccounts();      // 刷新左侧余额和日历数据
    // 拉当天最新结余
    let newBal;
    try{
      const dp=await j(API+`/accounts/${cur}/daily?from=${curDay}&to=${curDay}`);
      if(dp && dp.length) newBal=dp[0].balance;
    }catch(e){}
    await openDay(curDay,newBal);
  }catch(e){alert(e.message);}
}
async function editNoteDay(id,old,ds,bal){
  const nv=prompt('修改备注:',old||'');
  if(nv===null)return;
  await j(API+`/tx/${id}/note`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:nv.trim()})});
  await openDay(ds,bal);
}

function render(){
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  accounts.forEach(a=>{
    const t=document.createElement('div');
    t.className='tab'+(a.id===cur?' active':'');
    t.textContent=a.name; t.onclick=()=>selectAcc(a.id);
    tabs.appendChild(t);
  });
  const add=document.createElement('div');
  add.className='tab add';add.textContent='+ 添加孩子';add.onclick=newAccount;
  tabs.appendChild(add);

  const cols=document.getElementById('cols');
  if(cur===null){cols.style.display='none';return;}
  cols.style.display='';

  const a=accounts.find(x=>x.id===cur);
  document.getElementById('accName').textContent=a.name+' 的存钱罐';
  document.getElementById('balance').textContent=fmt(a.balance);
  const f=Math.pow(1+a.monthly_rate/100,1/30);
  document.getElementById('meta').textContent=
    `月利率 ${a.monthly_rate}% · 30天后约 ${fmt(a.balance*(1+a.monthly_rate/100))} · 每天约 +${fmt(a.balance*(f-1))}`;
  document.getElementById('rate').value=a.monthly_rate;

  if(calYear===undefined){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();}
  loadCalendar();
}

async function loadHistory(keepPage){
  if(cur===null)return;
  histRecs=await j(API+`/accounts/${cur}/tx`);
  if(!keepPage)histPage=1;
  renderHistPage();
}
function setPageSize(){
  histPageSize=parseInt(document.getElementById('pageSize').value,10);
  histPage=1; renderHistPage();
}
function gotoPage(p){
  const pages=Math.max(1,Math.ceil(histRecs.length/histPageSize));
  histPage=Math.min(Math.max(1,p),pages); renderHistPage();
}
function renderHistPage(){
  const tb=document.getElementById('histRows');tb.innerHTML='';
  const total=histRecs.length;
  const pages=Math.max(1,Math.ceil(total/histPageSize));
  if(histPage>pages)histPage=pages;
  if(!total){
    tb.innerHTML='<tr><td colspan="6" class="small">还没有记录,先存入一笔吧!</td></tr>';
    document.getElementById('pageInfo').textContent='0 条';
    document.getElementById('prevPage').disabled=true;
    document.getElementById('nextPage').disabled=true;
    return;
  }
  const start=(histPage-1)*histPageSize;
  const slice=histRecs.slice(start,start+histPageSize);
  slice.forEach(e=>{
    const d=new Date(e.ts);
    const tr=document.createElement('tr');
    const cls=e.type==='deposit'?'pos':'neg', s=e.type==='deposit'?'+':'-', label=e.type==='deposit'?'存入':'取出';
    const noteHtml=e.note?`<span class="txt" title="点击展开/收起">${esc(e.note)}</span>`:'<span class="small">—</span>';
    tr.innerHTML=`<td>${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}</td>
      <td>${label}</td><td class="${cls}">${s}${fmt(e.amount)}</td><td>${fmt(e.balance)}</td>
      <td class="note">${noteHtml}</td>
      <td><button class="editbtn" title="修改备注">✏️</button></td>`;
    const noteCell=tr.querySelector('.note');
    const txt=noteCell.querySelector('.txt');
    if(txt)txt.onclick=()=>noteCell.classList.toggle('open');
    tr.querySelector('.editbtn').onclick=()=>editNote(e.id,e.note);
    tb.appendChild(tr);
  });
  document.getElementById('pageInfo').textContent=`第 ${histPage}/${pages} 页 · 共 ${total} 条`;
  document.getElementById('prevPage').disabled=histPage<=1;
  document.getElementById('nextPage').disabled=histPage>=pages;
}

function moveMonth(d){
  calMonth+=d;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  loadCalendar();
}
function goToday(){
  const n=new Date();
  calYear=n.getFullYear();calMonth=n.getMonth();
  loadCalendar();
}
async function loadCalendar(){
  document.getElementById('calMonth').textContent=`${calYear}年${calMonth+1}月`;
  document.getElementById('dows').innerHTML=['日','一','二','三','四','五','六'].map(d=>`<div class="dow">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1);
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const from=`${calYear}-${pad(calMonth+1)}-01`;
  const to=`${calYear}-${pad(calMonth+1)}-${pad(daysInMonth)}`;
  let data=[];
  try{ data=await j(API+`/accounts/${cur}/daily?from=${from}&to=${to}`); }catch(e){}
  const map={}; data.forEach(p=>map[p.date]=p.balance);
  const max=Math.max(1,...data.map(p=>p.balance));

  const grid=document.getElementById('calGrid');grid.innerHTML='';
  for(let i=0;i<first.getDay();i++){const c=document.createElement('div');c.className='cell empty';grid.appendChild(c);}
  const n=new Date();const todayStr=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${calYear}-${pad(calMonth+1)}-${pad(day)}`;
    const bal=map[ds];
    const c=document.createElement('div');
    c.className='cell'+(ds===todayStr?' today':'');
    if(bal!==undefined && bal>0){
      const ratio=bal/max;
      c.style.background=`rgba(22,163,74,${0.10+ratio*0.45})`;
      c.innerHTML=`<div class="d">${day}</div><div class="v">${bal>=1000?(bal/1000).toFixed(1)+'k':Math.round(bal)}</div>`;
    }else{
      c.innerHTML=`<div class="d">${day}</div>`;
    }
    c.onclick=()=>openDay(ds,bal);
    grid.appendChild(c);
  }
}

loadAccounts().catch(e=>document.body.insertAdjacentHTML('afterbegin','<div class="card" style="color:#dc2626">连接后端失败: '+e.message+'</div>'));
</script>
